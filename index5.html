<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>task5</title>
</head>
<body>

    <h1>Images in Tables</h1>
    <hr>
    <h3>What are your favorite pets ?</h3>
    <!--WE HAVE TO USE CSS IF WE WANT TO DO A DOTTED TABLE-->
    <table border="1" cellpadding="10" cellspacing="0" >
        <tr>
            <th>Pet Image</th>
            <th>More Facts about (as a Link)</th>
        </tr>
        <tr>
            <td>
                <img src="horse.png" alt="Horse" width="200">
            </td>
            <td>

                <a href="https://en.wikipedia.org/wiki/Horse">Horse</a>
            </td>
        </tr>
        <tr>
            <td>
                <img src="dogs.png" alt="Dogs" width="200">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Dog">Dogs</a>
            </td>
        </tr>

        <tr>
            <td>
                <img src="cat.png" alt="Cats" width="200">
            </td>
            <td>
                <a href="https://en.wikipedia.org/wiki/Cat">Cats</a>
            </td>
        </tr>

    </table>

</body>
</html>
