<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>task7</title>
</head>
<body>

    <h2>Registration Form !</h2>
    <form>
    <fieldset>
        <p><b>Personal details</b></p>
        <hr>
        <br>
        <label for="fname">First name: <input type="text" id="fname" name="fname"></label>
            <br><br>

        <label for="lname">Last name: <input type="text" id="lname" name="lname"></label>
            <br><br>

        <label for="email">Email: <input type="email" id="email" name="email" required></label>
            <br><br>

        <label>
                Gender:
                <input type="radio" name="gender" value="male"> Male
                <input type="radio" name="gender" value="female"> Female
            </label>
            <br><br>

        <label>
            City:
            <select name="city">
                <option value="amman" selected>Amman</option>
                <option value="irbid">Irbid</option>
                <option value="zarqa">Zarqa</option>
                <option value="Al-Mafraq">Al-Mafraq</option>
                <option value="Ajloun">Ajloun</option>
                <option value="Jerash">Jerash</option>
                <option value="Madaba">Madaba</option>
                <option value="Balqa">Balqa</option>
                <option value="Karak">Karak</option>
                <option value="Tafilah">Tafilah</option>
                <option value="Maan">Maan</option>
                <option value="Aqaba">Aqaba</option>
            </select>
        </label>

        <br><br>

        <input type="submit" value="Sign up">

    </fieldset>
    </form>

</body>
</html>
